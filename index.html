<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ortega Fog</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #14213d;
    color: white;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 18px;
}

h1 {
    text-align: center;
}

.subtitle {
    text-align: center;
    opacity: 0.75;
    margin-bottom: 22px;
}

.day {
    margin-bottom: 22px;
}

.day-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
}

.row {
    padding: 11px 13px;
    border-radius: 10px;
    margin-bottom: 6px;
}

.partial {
    background: #ffd166;
    color: #111;
}

.full {
    background: #ef476f;
    color: white;
}

.clear {
    background: #35b779;
    text-align: center;
    padding: 20px;
    border-radius: 12px;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 0;
    border-radius: 10px;
    background: #4cc9f0;
    font-size: 17px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>⛰️ Ortega Fog</h1>

<div class="subtitle">
SR-74 Ortega Switchbacks • 5:00 AM–8:00 AM
</div>

<div id="forecast">Checking forecast...</div>

<button onclick="loadForecast()">↻ Update Forecast</button>

</div>

<script>

const lat = 33.6122;
const lon = -117.3620;

function getDewPointSpread(tempF, rh) {

    rh = Math.max(0.1, Math.min(100.0, rh));

    const tempC = (tempF - 32) * 5 / 9;

    const A = 17.625;
    const B = 243.04;

    const alpha =
        ((A * tempC) / (B + tempC)) +
        Math.log(rh / 100.0);

    const dewPointC =
        (B * alpha) / (A - alpha);

    const dewPointF =
        (dewPointC * 9 / 5) + 32;

    return tempF - dewPointF;
}


async function loadForecast() {

    const output = document.getElementById("forecast");

    output.innerHTML = "Checking forecast...";

    const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + lat +
        "&longitude=" + lon +
        "&hourly=temperature_2m,relative_humidity_2m" +
        "&temperature_unit=fahrenheit" +
        "&timezone=America%2FLos_Angeles" +
        "&forecast_days=7";

    try {

        const response = await fetch(url);

        const data = await response.json();

        const forecast = data.hourly;

        let hazardEvents = 0;
        let currentDay = "";
        let html = "";

        for (let i = 0; i < forecast.time.length; i++) {

            const timeString = forecast.time[i];

            const datePart = timeString.substring(0, 10);
            const hour = Number(timeString.substring(11, 13));

            if (hour < 5 || hour > 8) {
                continue;
            }

            const temp = forecast.temperature_2m[i];
            const rh = forecast.relative_humidity_2m[i];

            const spread =
                getDewPointSpread(temp, rh);

            const fullySocked =
                spread <= 2.0 &&
                rh >= 95.0;

            const partiallySocked =
                spread <= 4.5 &&
                rh >= 83.0 &&
                !fullySocked;


            if (!fullySocked && !partiallySocked) {
                continue;
            }


            hazardEvents++;


            if (datePart !== currentDay) {

                if (currentDay !== "") {
                    html += "</div>";
                }

                const d = new Date(datePart + "T12:00:00");

                const dayName =
                    d.toLocaleDateString(
                        "en-US",
                        {
                            weekday: "long",
                            month: "short",
                            day: "numeric"
                        }
                    );

                html +=
                    `<div class="day">
                    <div class="day-title">
                    📅 ${dayName}
                    </div>`;

                currentDay = datePart;
            }


            let displayHour = hour;

            if (displayHour > 12) {
                displayHour -= 12;
            }

            const displayTime =
                displayHour + ":00 AM";


            if (fullySocked) {

                html +=
                    `<div class="row full">
                    ${displayTime}
                    — 🌫️ FOG
                    — ${Math.round(temp)}°F
                    — RH ${Math.round(rh)}%
                    — Spread ${spread.toFixed(1)}°F
                    </div>`;

            } else {

                html +=
                    `<div class="row partial">
                    ${displayTime}
                    — 🟡 PARTIAL FOG
                    — ${Math.round(temp)}°F
                    — RH ${Math.round(rh)}%
                    — Spread ${spread.toFixed(1)}°F
                    </div>`;
            }
        }


        if (currentDay !== "") {
            html += "</div>";
        }


        if (hazardEvents === 0) {

            html =
                `<div class="clear">
                🟢 NO FOG CONDITIONS FOUND
                </div>`;
        }


        output.innerHTML = html;

    }

    catch (error) {

        output.innerHTML =
            `<div class="row full">
            ⚠️ Could not retrieve forecast
            </div>`;
    }
}


loadForecast();

</script>

</body>
</html>
