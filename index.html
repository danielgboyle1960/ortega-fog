<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ortega Fog</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #14213d;
    color: white;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 18px;
}

h1 {
    text-align: center;
    margin: 8px 0 4px;
}

.subtitle {
    text-align: center;
    opacity: 0.75;
    margin-bottom: 22px;
}

.day {
    margin-bottom: 22px;
}

.day-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
}

.row {
    padding: 11px 13px;
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 16px;
}

.partial {
    background: #ffd166;
    color: #111;
}

.full {
    background: #ef476f;
    color: white;
}

.clear {
    background: #35b779;
    text-align: center;
    padding: 20px;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 0;
    border-radius: 10px;
    background: #4cc9f0;
    font-size: 17px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>⛰️ Ortega Fog</h1>

<div class="subtitle">
SR-74 Ortega Switchbacks • 5:00 AM–8:00 AM • Next 7 Days
</div>

<div id="forecast">
Checking forecast...
</div>

<button onclick="loadForecast()">
↻ Update Forecast
</button>

</div>

<script>

const lat = 33.6122;
const lon = -117.3620;


/* SAME DEW-POINT CALCULATION AS YOUR PYTHON PROGRAM */

function getDewPointSpread(tempF, rh) {

    rh = Math.max(0.1, Math.min(100.0, rh));

    const tempC = (tempF - 32) * 5 / 9;

    const A = 17.625;
    const B = 243.04;

    const alpha =
        ((A * tempC) / (B + tempC)) +
        Math.log(rh / 100.0);

    const dewPointC =
        (B * alpha) / (A - alpha);

    const dewPointF =
        (dewPointC * 9 / 5) + 32;

    return tempF - dewPointF;
}


/* SAME FOG THRESHOLDS AS YOUR PYTHON PROGRAM */

function classify(temp, rh) {

    const spread =
        getDewPointSpread(temp, rh);

    const fullySocked =
        spread <= 2.0 &&
        rh >= 95.0;

    const partiallySocked =
        spread <= 4.5 &&
        rh >= 83.0 &&
        !fullySocked;

    if (fullySocked) {

        return {
            type: "full",
            label: "🌫️ FOG",
            spread: spread
        };
    }

    if (partiallySocked) {

        return {
            type: "partial",
            label: "🟡 PARTIAL FOG",
            spread: spread
        };
    }

    return null;
}


function formatDay(dateString) {

    const d =
        new Date(dateString + "T12:00:00");

    return d.toLocaleDateString(
        "en-US",
        {
            weekday: "long",
            month: "short",
            day: "numeric"
        }
    );
}


function formatHour(hour) {

    let displayHour = hour;
    let suffix = "AM";

    if (hour === 0) {
        displayHour = 12;
    }

    if (hour === 12) {
        suffix = "PM";
    }

    if (hour > 12) {
        displayHour = hour - 12;
        suffix = "PM";
    }

    return displayHour + ":00 " + suffix;
}


async function loadForecast() {

    const output =
        document.getElementById("forecast");

    output.innerHTML =
        "Checking forecast...";


    /*
       NOAA GFS / HRRR MODEL
       Pinned instead of generic best-match endpoint
    */

    const url =
        "https://api.open-meteo.com/v1/gfs" +
        "?latitude=" + lat +
        "&longitude=" + lon +
        "&hourly=temperature_2m,relative_humidity_2m" +
        "&temperature_unit=fahrenheit" +
        "&timezone=America%2FLos_Angeles" +
        "&forecast_days=7";


    try {

        const response =
            await fetch(url, {
                cache: "no-store"
            });

        if (!response.ok) {

            throw new Error(
                "Weather service error"
            );
        }


        const data =
            await response.json();

        const forecast =
            data.hourly;

        const days = {};

        let hazardEvents = 0;


        for (
            let i = 0;
            i < forecast.time.length;
            i++
        ) {

            /*
               Example:
               2026-09-16T05:00

               Read the hour directly from
               Open-Meteo so the browser
               cannot shift the timezone.
            */

            const timeString =
                forecast.time[i];

            const dateString =
                timeString.substring(0, 10);

            const hour =
                Number(
                    timeString.substring(11, 13)
                );


            /* SAME 5 AM THROUGH 8 AM FILTER */

            if (hour < 5 || hour > 8) {
                continue;
            }


            const temp =
                forecast.temperature_2m[i];

            const rh =
                forecast.relative_humidity_2m[i];


            const condition =
                classify(temp, rh);


            /*
               Clear hours are not displayed.
            */

            if (!condition) {
                continue;
            }


            hazardEvents++;


            if (!days[dateString]) {

                days[dateString] = [];
            }


            days[dateString].push({

                hour: hour,
                temp: temp,
                rh: rh,
                condition: condition

            });
        }


        if (hazardEvents === 0) {

            output.innerHTML =
                `<div class="clear">
                    🟢 NO FOG EXPECTED
                </div>`;

            return;
        }


        output.innerHTML = "";


        for (const dateString in days) {

            const section =
                document.createElement("div");

            section.className =
                "day";


            const title =
                document.createElement("div");

            title.className =
                "day-title";

            title.textContent =
                "📅 " +
                formatDay(dateString);


            section.appendChild(title);


            for (
                const item
                of days[dateString]
            ) {

                const row =
                    document.createElement("div");

                row.className =
                    "row " +
                    item.condition.type;


                row.innerHTML =
                    `<b>${formatHour(item.hour)}</b>
                     — ${item.condition.label}
                     — ${Math.round(item.temp)}°F
                     — RH ${Math.round(item.rh)}%
                     — Spread ${item.condition.spread.toFixed(1)}°F`;


                section.appendChild(row);
            }


            output.appendChild(section);
        }

    }

    catch (error) {

        output.innerHTML =
            `<div class="row full">
                ⚠️ Could not retrieve forecast
            </div>`;

        console.error(error);
    }
}


loadForecast();

</script>

</body>
</html>
