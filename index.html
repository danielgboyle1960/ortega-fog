<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ortega Fog</title>

<style>
:root {
    --bg: #14213d;
    --text: #ffffff;
    --muted: #b9c6de;
    --cyan: #4cc9f0;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}

.container {
    max-width: 760px;
    margin: auto;
    padding: 18px;
}

.header {
    display: flex;
    align-items: center;
    gap: 14px;
    justify-content: center;
    margin-top: 6px;
}

.road-icon {
    width: 56px;
    height: 56px;
}

h1 {
    margin: 0;
    font-size: 32px;
}

.subtitle {
    text-align: center;
    color: var(--muted);
    margin: 8px 0 10px;
    font-size: 15px;
}

.summary {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin: 10px 0 4px;
}

.updated {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 22px;
}

.day {
    margin-bottom: 22px;
}

.day-title {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 8px;
}

.row {
    font-size: 18px;
    line-height: 1.55;
    margin: 4px 0;
}

/* PURE SOLID CIRCLES */
.dot {
    display: inline-block;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    margin: 0 9px 0 4px;
    vertical-align: -2px;
    background-image: none;
    border: none;
    outline: none;
    box-shadow: none;
    opacity: 1;
}

/* PURE BRIGHT RED */
.fog-dot {
    background-color: #ff0000;
    background-image: none;
    border: none;
    box-shadow: none;
    opacity: 1;
}

/* PURE BRIGHT YELLOW */
.partial-dot {
    background-color: #ffff00;
    background-image: none;
    border: none;
    box-shadow: none;
    opacity: 1;
}

.alert-dot {
    display: inline-block;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background-color: #ff0000;
    background-image: none;
    margin-right: 7px;
    vertical-align: -1px;
    border: none;
    outline: none;
    box-shadow: none;
    opacity: 1;
}

.alert-dot.pulse {
    animation: none;
}

.clear-message {
    text-align: center;
    padding: 18px 0;
    font-size: 18px;
    color: var(--muted);
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: 0;
    border-radius: 10px;
    background: var(--cyan);
    color: #07111f;
    font-size: 17px;
    font-weight: bold;
}

@media (max-width:620px) {
    .container { padding:14px; }
    .road-icon { width:46px; height:46px; }
    h1 { font-size:28px; }
    .day-title { font-size:19px; }
    .row { font-size:15px; }
    .summary { font-size:16px; }
}
</style>
</head>

<body>

<div class="container">

<div class="header">

<svg class="road-icon" viewBox="0 0 64 64">

<defs>
<linearGradient id="mtn" x1="0" x2="1">
<stop offset="0%" stop-color="#8ecae6"/>
<stop offset="100%" stop-color="#ffffff"/>
</linearGradient>
</defs>

<path
d="M7 45 L22 19 L33 35 L42 22 L57 45 Z"
fill="url(#mtn)"
opacity="0.95"/>

<path
d="M26 64 C22 52 31 45 29 36 C28 31 24 27 27 22"
stroke="#d9d9d9"
stroke-width="7"
fill="none"
stroke-linecap="round"/>

<path
d="M26 64 C22 52 31 45 29 36 C28 31 24 27 27 22"
stroke="#ffffff"
stroke-width="2"
fill="none"
stroke-dasharray="4 5"
stroke-linecap="round"/>

</svg>

<h1>Ortega Fog</h1>

</div>

<div class="subtitle">
SR-74 Ortega Switchbacks • 5:00 AM–8:00 AM • Next 7 Days
</div>

<div id="summary" class="summary"></div>
<div id="updated" class="updated"></div>

<div id="forecast">Checking forecast...</div>

<button onclick="loadForecast()">↻ Update Forecast</button>

</div>

<script>

const lat = 33.6122;
const lon = -117.3620;

function getDewPointSpread(tempF,rh) {

    rh = Math.max(0.1,Math.min(100,rh));

    const tempC = (tempF-32)*5/9;
    const A = 17.625;
    const B = 243.04;

    const alpha =
        ((A*tempC)/(B+tempC)) +
        Math.log(rh/100);

    const dewPointC =
        (B*alpha)/(A-alpha);

    const dewPointF =
        dewPointC*9/5+32;

    return tempF-dewPointF;
}

function classify(temp,rh) {

    const spread = getDewPointSpread(temp,rh);

    if (spread <= 2.0 && rh >= 95) {
        return {
            type:"fog",
            label:"FOG",
            spread:spread
        };
    }

    if (spread <= 4.5 && rh >= 83) {
        return {
            type:"partial",
            label:"PARTIAL FOG",
            spread:spread
        };
    }

    return null;
}

function formatDay(dateString) {

    const d = new Date(dateString+"T12:00:00");

    return d.toLocaleDateString(
        "en-US",
        {
            weekday:"long",
            month:"short",
            day:"numeric"
        }
    );
}

function formatHour(hour) {

    let displayHour=hour;
    let suffix="AM";

    if(hour===0)
        displayHour=12;

    else if(hour===12)
        suffix="PM";

    else if(hour>12) {
        displayHour=hour-12;
        suffix="PM";
    }

    return displayHour+":00 "+suffix;
}

function setUpdatedTime() {

    const now=new Date();

    document.getElementById("updated").textContent =
        "Updated "+
        now.toLocaleTimeString(
            "en-US",
            {
                hour:"numeric",
                minute:"2-digit"
            }
        );
}

function setSummary(events) {

    const summary =
        document.getElementById("summary");

    if(events.length===0) {
        summary.textContent =
            "No fog or partial fog expected";
        return;
    }

    const fogEvents =
        events.filter(
            e => e.condition.type==="fog"
        );

    if(fogEvents.length>0) {

        const firstFog=fogEvents[0];

        const sameDay =
            fogEvents.filter(
                e =>
                e.dateString===
                firstFog.dateString
            );

        const hours =
            sameDay
            .map(e=>e.hour)
            .sort((a,b)=>a-b);

        const start =
            formatHour(hours[0])
            .replace(":00","");

        const end =
            formatHour(hours[hours.length-1])
            .replace(":00","");

        summary.innerHTML =
            '<span class="alert-dot"></span>'+
            'Highest risk: '+
            formatDay(firstFog.dateString)+
            ' '+
            start+
            (hours.length>1 ? '–'+end : '');

        return;
    }

    const first=events[0];

    summary.innerHTML =
        '<span class="dot partial-dot" '+
        'style="width:13px;height:13px;margin-right:7px;"></span>'+
        'Partial fog possible: '+
        formatDay(first.dateString)+
        ' '+
        formatHour(first.hour).replace(":00","");
}

async function loadForecast() {

    const output =
        document.getElementById("forecast");

    output.innerHTML =
        "Checking forecast...";

    const url =
        "https://api.open-meteo.com/v1/gfs"+
        "?latitude="+lat+
        "&longitude="+lon+
        "&hourly=temperature_2m,relative_humidity_2m"+
        "&temperature_unit=fahrenheit"+
        "&timezone=America%2FLos_Angeles"+
        "&forecast_days=7";

    try {

        const response =
            await fetch(
                url,
                {cache:"no-store"}
            );

        if(!response.ok)
            throw new Error(
                "Weather service error"
            );

        const data =
            await response.json();

        const forecast=data.hourly;

        const days={};
        const allEvents=[];

        for(
            let i=0;
            i<forecast.time.length;
            i++
        ) {

            const timeString =
                forecast.time[i];

            const dateString =
                timeString.substring(0,10);

            const hour =
                Number(
                    timeString.substring(11,13)
                );

            if(hour<5 || hour>8)
                continue;

            const temp =
                forecast.temperature_2m[i];

            const rh =
                forecast.relative_humidity_2m[i];

            const condition =
                classify(temp,rh);

            if(!condition)
                continue;

            const event={
                dateString:dateString,
                hour:hour,
                temp:temp,
                rh:rh,
                condition:condition
            };

            allEvents.push(event);

            if(!days[dateString])
                days[dateString]=[];

            days[dateString].push(event);
        }

        setSummary(allEvents);
        setUpdatedTime();

        if(allEvents.length===0) {

            output.innerHTML =
                '<div class="clear-message">'+
                'No fog or partial fog expected.'+
                '</div>';

            return;
        }

        output.innerHTML="";

        for(const dateString in days) {

            const section =
                document.createElement("div");

            section.className="day";

            const title =
                document.createElement("div");

            title.className="day-title";

            title.textContent =
                "📅 "+formatDay(dateString);

            section.appendChild(title);

            for(const item of days[dateString]) {

                const row =
                    document.createElement("div");

                row.className="row";

                const dotClass =
                    item.condition.type==="fog"
                    ? "fog-dot"
                    : "partial-dot";

                row.innerHTML =
                    '• '+
                    '<span class="dot '+
                    dotClass+
                    '"></span>'+
                    '<b>'+
                    formatHour(item.hour)+
                    '</b>'+
                    ' — '+
                    item.condition.label+
                    ' — '+
                    Math.round(item.temp)+
                    '°F'+
                    ' — RH '+
                    Math.round(item.rh)+
                    '%'+
                    ' — Spread '+
                    item.condition.spread.toFixed(1)+
                    '°F';

                section.appendChild(row);
            }

            output.appendChild(section);
        }

    } catch(error) {

        document.getElementById("summary").textContent="";
        document.getElementById("updated").textContent="";

        output.innerHTML =
            '<div class="clear-message">'+
            '⚠️ Could not retrieve forecast'+
            '</div>';

        console.error(error);
    }
}

loadForecast();

</script>

</body>
</html>
